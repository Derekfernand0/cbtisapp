name: cbtis66_app
description: "Aplicación informativa del CBTIS 66"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.2.3 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  # UI y Diseño
  google_fonts: ^6.1.0
  animations: ^2.0.11

  flutter_svg: ^2.0.10
  # Gráficas
  fl_chart: ^0.65.0
  # Videos
  youtube_player_flutter: ^9.1.3
  # Enlaces externos (para teléfono, web, facebook)
  url_launcher: ^6.2.1
  # Gestión de Estado
  flutter_riverpod: ^2.4.9

  video_player: ^2.9.1
  shared_preferences: ^2.2.3
  
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.13.1

# Configuración de Assets
flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/videos/
    - assets/icons/
    - assets/videos/
    
flutter_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/icons/logo.png" # Asegúrate de que tu imagen esté aquí
  min_sdk_android: 21 # Soporte para Android moderno